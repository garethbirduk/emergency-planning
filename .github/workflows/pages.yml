name: pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Assemble site
        # The demo page loads the real engine: the site is the static
        # shell plus the tool's own .py files and the dummy sample.
        run: |
          mkdir -p _site/tools _site/samples
          cp site/* _site/
          cp tools/*.py _site/tools/
          cp samples/pat.sample.xlsx _site/samples/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
